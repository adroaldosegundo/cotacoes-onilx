[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cotacoes-onilx"
version = "0.1.0"
description = "Base compartilhada de coleta de cotacoes cripto e macro (Kairos ION, InformeMensalOnilX v2.0)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.3.0",
    "lxml>=4.9.0",
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
include = ["cotacoes_onilx*"]
